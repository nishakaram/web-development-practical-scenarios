<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Result Card</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>Class Result Sheet</h1>

    <div class="button-area">
      <button id="generateBtn">Generate Results</button>
    </div>

    <!-- The table is hidden until the button is clicked -->
    <div id="resultArea" class="hidden">
      <div class="table-wrapper">
        <table>
          <thead>
            <tr>
              <th>Name</th>
              <th>Total (/300)</th>
              <th>Percentage</th>
              <th>Grade</th>
              <th>Result</th>
            </tr>
          </thead>
          <tbody id="resultBody"></tbody>
        </table>
      </div>

      <div class="summary">
        <p><strong>Topper:</strong> <span id="topperText"></span></p>
        <p><strong>Class average:</strong> <span id="averageText"></span></p>
        <p><strong>Passed:</strong> <span id="passedText"></span></p>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
